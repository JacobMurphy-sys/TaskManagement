# 🗺 The project timeline (docs/) on GitHub Pages, published on every push to main (the live branch: what's
# on the timeline is what's live; work in progress on dev isn't shown until it's merged).
# The commits per day are worked out from the full git history at publish time, so the page is
# always current without committing anything back to the branch.
# One-time set-up: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Timeline on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, for the commits per day
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Commits per day from git
        run: node scripts/timeline-activity.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # GitHub Pages now and then answers "Deployment failed, try again later" on its side: wait and try once more
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}" >> "$GITHUB_OUTPUT"

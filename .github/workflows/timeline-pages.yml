# 🗺 The project timeline (docs/) on GitHub Pages, published on every push.
# The commits per day are worked out from the full git history at publish time, so the page is
# always current without committing anything back to the branch.
# One-time set-up: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Timeline on GitHub Pages

on:
  push:
    branches: [main, claude/project-task-management-system-ssxgfs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, for the commits per day
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Commits per day from git
        run: node scripts/timeline-activity.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

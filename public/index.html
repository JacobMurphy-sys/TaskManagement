<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232f6fdb'/><path d='M4 8.5l2.5 2.5L12 5' stroke='white' stroke-width='2' fill='none'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a chosen light/dark theme before the page draws (no flash).
    try { const t = JSON.parse(localStorage.getItem('theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* storage unavailable */ }
  </script>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">✔ CI Manager</div>
    <input id="search" type="search" placeholder="Search…  ( / )" autocomplete="off">
    <nav>
      <a href="#/dashboard" data-nav="dashboard">📋 Dashboard</a>
      <a href="#/tasks" data-nav="tasks">✅ Tasks</a>
      <a href="#/kanban" data-nav="kanban">🗂 Projects board</a>
      <a href="#/ideas" data-nav="ideas">💡 Ideation</a>
      <a href="#/library" data-nav="library">📚 Library</a>
      <a href="#/report" data-nav="report">📰 Report</a>
      <a href="#/log" data-nav="log">🕘 Activity log</a>
      <a href="#/backups" data-nav="backups">💾 Backups</a>
      <a href="#/contacts" data-nav="contacts">📇 Contacts</a>
      <a href="#/settings" data-nav="settings">⚙ Settings</a>
    </nav>
    <div class="side-head">
      <span>Projects</span>
      <button class="link" data-action="new-project" title="New project">+ New</button>
    </div>
    <ul id="project-list"></ul>
    <label class="small muted show-archived"><input type="checkbox" id="show-archived"> Show archived</label>
    <button class="link small stop-server" data-action="stop-server" title="Shut down the CI Manager">⏻ Stop server</button>
  </aside>

  <div id="page">
    <header id="topbar">
      <button class="menu-toggle" data-action="toggle-sidebar" aria-label="Menu">☰</button>
      <div id="clock" class="muted"></div>
      <div class="spacer"></div>
      <button id="theme-toggle" class="theme-switch" role="switch" aria-checked="false" data-action="toggle-theme" title="Dark mode on/off">
        <span class="track"><span class="knob">☀</span></span><span class="lbl">Dark</span></button>
      <button data-action="quick-note" title="Quick note (N)">📝<span class="lbl"> Quick note</span></button>
      <button id="notify-btn" data-action="enable-notifications" hidden>🔔<span class="lbl"> Enable desktop alerts</span></button>
      <a id="bell" href="#/dashboard" title="Due / overdue tasks">🔔 <span id="bell-count" class="count" hidden>0</span></a>
    </header>
    <main id="main"></main>
  </div>

  <div id="popups" aria-live="assertive"></div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-body"></div></dialog>

  <script src="gantt.js"></script>
  <script src="report.js"></script>
  <script src="charter.js"></script>
  <script src="meetings.js"></script>
  <script src="people.js"></script>
  <script src="library.js"></script>
  <script src="app.js"></script>
</body>
</html>

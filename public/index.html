<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SITHUB</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- lets Edge / Chrome install it as an app: its own window and taskbar icon -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="sithub-192.png">
  <meta name="theme-color" content="#430099">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a chosen light/dark theme before the page draws (no flash).
    try { const t = JSON.parse(localStorage.getItem('theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* storage unavailable */ }
  </script>
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <span>Projects</span>
      <button class="link" data-action="new-project" title="New project">+ New</button>
    </div>
    <ul id="project-list"></ul>
    <label class="small muted show-archived"><input type="checkbox" id="show-archived"> Show archived</label>
  </aside>

  <div id="page">
    <header id="topbar">
      <button class="menu-toggle" data-action="toggle-sidebar" aria-label="Sidebar" title="Hide the sidebar ( [ )">☰</button>
      <!-- the name, the date and the time: always in view, also with the sidebar hidden -->
      <a class="top-brand" href="#/dashboard" title="SITHUB — Home"><span class="brand"><img src="favicon.svg" alt="" class="brand-ico">SITHUB</span><span id="clock"></span></a>
      <nav id="topnav">
        <a href="#/dashboard" data-nav="dashboard" title="Home"><span class="ico">🏠</span><span class="lbl"> Home</span></a>
        <a href="#/tasks" data-nav="tasks" title="Tasks"><span class="ico">✅</span><span class="lbl"> Tasks</span></a>
        <a href="#/calendar" data-nav="calendar" title="Calendar"><span class="ico">📅</span><span class="lbl"> Calendar</span></a>
        <a href="#/kanban" data-nav="kanban" title="Projects: the board"><span class="ico">🗂</span><span class="lbl"> Projects</span></a>
        <a href="#/team" data-nav="team" title="People: what's open for each person, and their next action"><span class="ico">👥</span><span class="lbl"> People</span></a>
        <a href="#/ideas" data-nav="ideas" title="Ideation"><span class="ico">💡</span><span class="lbl"> Ideas</span></a>
        <a href="#/library" data-nav="library" title="Library"><span class="ico">📚</span><span class="lbl"> Library</span></a>
        <a href="#/capex" data-nav="capex" title="CAPEX: planned investments and larger projects"><span class="ico">💶</span><span class="lbl"> CAPEX</span></a>
        <a href="#/kpi" data-nav="kpi" title="Reporting: the weekly SC report (A3), operations, quality and EHS by month"><span class="ico">📊</span><span class="lbl"> Reporting</span></a>
        <a href="#/planning" data-nav="planning" title="Production: perso, Matching and insights"><span class="ico">🏭</span><span class="lbl"> Production</span></a>
        <a href="#/cpm" data-nav="cpm" title="Capacity planning: forecasts against capacity, flex and scenarios"><span class="ico">📐</span><span class="lbl"> Capacity</span></a>
        <a href="#/forecast" data-nav="forecast" title="Forecast: the customer forecasts sent in, and the upload link for those who send them"><span class="ico">📈</span><span class="lbl"> Forecast</span></a>
      </nav>
      <div class="spacer"></div>
      <button id="search-btn" class="phone-only" type="button" title="Search" aria-label="Search">🔍</button>
      <input id="search" type="search" placeholder="Search…  ( / )" autocomplete="off">
      <button data-action="quick-note" title="Quick note (N)">📝</button>
      <div id="mail" class="top-menu"><button id="mail-btn" type="button" aria-haspopup="true" title="Messages: pokes about your tasks, news on your tickets">✉ <span id="mail-count" class="count" hidden>0</span></button><div id="mail-panel" class="top-menu-panel mail-panel" hidden></div></div>
      <button data-action="ticket" class="not-phone" title="Report a bug, ask for a feature or a question">💬</button>
      <div id="notices" class="top-menu" hidden><button id="notices-btn" type="button" aria-haspopup="true">⚠</button><div id="notices-panel" class="top-menu-panel notices-panel" hidden></div></div>
      <a id="bell" href="#/dashboard" title="Due / overdue tasks">🔔 <span id="bell-count" class="count" hidden>0</span></a>
      <div class="top-menu">
        <button id="menu-btn" data-action="toggle-menu" aria-haspopup="true" aria-expanded="false" title="More">⋯</button>
        <div id="top-menu" class="top-menu-panel" hidden>
          <a href="#/contacts" data-nav="contacts">📇 Contacts</a>
          <a href="#/report" data-nav="report">📰 Status report</a>
          <a href="#/tickets" data-nav="tickets">🎫 Tickets — bugs and requests</a>
          <button data-action="ticket" class="phone-only">💬 Report a bug or ask for something</button>
          <hr>
          <a href="#/log" data-nav="log">🕘 Activity log</a>
          <a href="#/backups" data-nav="backups">💾 Backups</a>
          <a href="#/settings" data-nav="settings">⚙ Settings</a>
          <hr>
          <button id="theme-toggle" class="theme-switch" role="switch" aria-checked="false" data-action="toggle-theme" title="Dark mode on/off">
            <span class="track"><span class="knob">☀</span></span><span>Dark mode</span></button>
          <button id="notify-btn" data-action="enable-notifications" hidden>🔔 Enable desktop alerts</button>
          <hr>
          <button class="stop-server" data-action="stop-server" title="Shut down SITHUB">⏻ Stop server</button>
        </div>
      </div>
    </header>
    <main id="main"></main>
  </div>

  <div id="popups" aria-live="assertive"></div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-body"></div></dialog>

  <script src="gantt.js"></script>
  <script src="report.js"></script>
  <script src="charter.js"></script>
  <script src="meetings.js"></script>
  <script src="people.js"></script>
  <script src="orgtree.js"></script>
  <script src="team.js"></script>
  <script src="capex.js"></script>
  <script src="forecast.js"></script>
  <script src="library.js"></script>
  <script src="attachments.js"></script>
  <script src="calendar.js"></script>
  <script src="kpi.js"></script>
  <script src="qcharts.js"></script>
  <script src="quality.js"></script>
  <script src="operations.js"></script>
  <script src="otd.js"></script>
  <script src="plansheet-model.js"></script>
  <script src="planning.js"></script>
  <script src="planauto.js"></script>
  <script src="planlearn.js"></script>
  <script src="planfind.js"></script>
  <script src="dplus.js"></script>
  <script src="optimise.js"></script>
  <script src="places.js"></script>
  <script src="production.js"></script>
  <script src="cpm.js"></script>
  <script src="collab.js"></script>
  <script src="accounts.js"></script>
  <script src="reschedule.js"></script>
  <script src="tickets.js"></script>
  <script src="messages.js"></script>
  <script src="app.js"></script>
</body>
</html>

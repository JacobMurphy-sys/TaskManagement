<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232f6fdb'/><path d='M4 8.5l2.5 2.5L12 5' stroke='white' stroke-width='2' fill='none'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a chosen light/dark theme before the page draws (no flash).
    try { const t = JSON.parse(localStorage.getItem('theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* storage unavailable */ }
  </script>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">✔ CI Manager</div>
    <div id="clock" class="small muted"></div>
    <div class="side-head">
      <span>Projects</span>
      <button class="link" data-action="new-project" title="New project">+ New</button>
    </div>
    <ul id="project-list"></ul>
    <label class="small muted show-archived"><input type="checkbox" id="show-archived"> Show archived</label>
  </aside>

  <div id="page">
    <header id="topbar">
      <button class="menu-toggle" data-action="toggle-sidebar" aria-label="Projects" title="Projects">☰</button>
      <nav id="topnav">
        <a href="#/dashboard" data-nav="dashboard" title="Dashboard">📋<span class="lbl"> Dashboard</span></a>
        <a href="#/tasks" data-nav="tasks" title="Tasks">✅<span class="lbl"> Tasks</span></a>
        <a href="#/calendar" data-nav="calendar" title="Calendar">📅<span class="lbl"> Calendar</span></a>
        <a href="#/kanban" data-nav="kanban" title="Projects board">🗂<span class="lbl"> Board</span></a>
        <a href="#/ideas" data-nav="ideas" title="Ideation">💡<span class="lbl"> Ideas</span></a>
        <a href="#/library" data-nav="library" title="Library">📚<span class="lbl"> Library</span></a>
        <a href="#/kpi" data-nav="kpi" title="Weekly KPIs: A3 report and Database">📊<span class="lbl"> KPIs</span></a>
        <a href="#/report" data-nav="report" title="Report">📰<span class="lbl"> Report</span></a>
        <a href="#/contacts" data-nav="contacts" title="Contacts">📇<span class="lbl"> Contacts</span></a>
      </nav>
      <div class="spacer"></div>
      <input id="search" type="search" placeholder="Search…  ( / )" autocomplete="off">
      <button data-action="quick-note" title="Quick note (N)">📝<span class="lbl wide-only"> Quick note</span></button>
      <a id="bell" href="#/dashboard" title="Due / overdue tasks">🔔 <span id="bell-count" class="count" hidden>0</span></a>
      <div class="top-menu">
        <button id="menu-btn" data-action="toggle-menu" aria-haspopup="true" aria-expanded="false" title="More">⋯</button>
        <div id="top-menu" class="top-menu-panel" hidden>
          <a href="#/log" data-nav="log">🕘 Activity log</a>
          <a href="#/backups" data-nav="backups">💾 Backups</a>
          <a href="#/settings" data-nav="settings">⚙ Settings</a>
          <hr>
          <button id="theme-toggle" class="theme-switch" role="switch" aria-checked="false" data-action="toggle-theme" title="Dark mode on/off">
            <span class="track"><span class="knob">☀</span></span><span>Dark mode</span></button>
          <button id="notify-btn" data-action="enable-notifications" hidden>🔔 Enable desktop alerts</button>
          <hr>
          <button class="stop-server" data-action="stop-server" title="Shut down the CI Manager">⏻ Stop server</button>
        </div>
      </div>
    </header>
    <main id="main"></main>
  </div>

  <div id="popups" aria-live="assertive"></div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-body"></div></dialog>

  <script src="gantt.js"></script>
  <script src="report.js"></script>
  <script src="charter.js"></script>
  <script src="meetings.js"></script>
  <script src="people.js"></script>
  <script src="library.js"></script>
  <script src="attachments.js"></script>
  <script src="calendar.js"></script>
  <script src="kpi.js"></script>
  <script src="app.js"></script>
</body>
</html>
